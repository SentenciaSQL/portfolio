<a class="skip-link" href="#main">{{ i18n.t('common.skipToContent') }}</a>

<header class="sticky top-0 z-50 border-b border-line-soft bg-ink">
  <nav
    class="mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:px-6 lg:px-8"
    aria-label="Primary"
  >
    <a
      routerLink="/"
      fragment="home"
      class="shrink-0 font-semibold tracking-tight text-paper no-underline"
    >
      <span class="font-mono text-brass">{{ site.shortName }}</span>
      <span class="ml-2 hidden sm:inline">{{ site.name }}</span>
    </a>

    <ul class="ml-6 hidden items-center xl:flex">
      @for (item of navItems; track item.id) {
        <li>
          <button
            type="button"
            class="nav-link bg-transparent"
            [class.is-active]="isHome() && active() === item.id"
            [attr.aria-current]="isHome() && active() === item.id ? 'location' : null"
            (click)="go(item.id)"
          >
            {{ i18n.t(item.labelKey) }}
          </button>
        </li>
      }
    </ul>

    <div class="ml-auto flex items-center gap-1">
      <a
        class="icon-btn"
        [href]="site.github"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('nav.github')"
      >
        <app-icon name="github" />
      </a>
      <a
        class="icon-btn"
        [href]="site.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('nav.linkedin')"
      >
        <app-icon name="linkedin" />
      </a>
      <a
        class="btn-secondary !hidden !px-3 !py-2 text-xs sm:!inline-flex"
        [href]="site.cv"
        target="_blank"
        rel="noopener noreferrer"
      >
        <app-icon name="download" />
        <span>{{ i18n.t('nav.downloadCv') }}</span>
      </a>
      <button
        type="button"
        class="btn-ghost !px-2.5 !py-2 font-mono text-xs"
        (click)="i18n.toggle()"
        [attr.aria-label]="i18n.lang() === 'en' ? 'Cambiar a español' : 'Switch to English'"
      >
        {{ i18n.lang() === 'en' ? 'ES' : 'EN' }}
      </button>
      <button
        type="button"
        class="icon-btn xl:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? i18n.t('nav.closeMenu') : i18n.t('nav.openMenu')"
      >
        <app-icon [name]="menuIcon()" />
      </button>
    </div>
  </nav>
</header>

@if (menuOpen()) {
  <div
    class="fixed inset-0 z-40 bg-ink/70 xl:hidden"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <aside
    class="fixed inset-y-0 right-0 z-50 flex w-[min(20rem,88vw)] flex-col border-l border-line bg-ink-2 px-5 py-6 shadow-2xl xl:hidden"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="i18n.t('nav.openMenu')"
  >
    <div class="mb-6 flex items-center justify-between">
      <span class="font-mono text-sm text-brass">{{ site.shortName }}</span>
      <button
        type="button"
        class="icon-btn"
        (click)="closeMenu()"
        [attr.aria-label]="i18n.t('nav.closeMenu')"
      >
        <app-icon name="close" />
      </button>
    </div>

    <ul class="flex flex-col gap-1">
      @for (item of navItems; track item.id) {
        <li>
          <button
            type="button"
            class="w-full rounded-lg px-3 py-3 text-left text-base text-paper-dim hover:bg-ink-3 hover:text-paper"
            [class.text-paper]="isHome() && active() === item.id"
            [attr.aria-current]="isHome() && active() === item.id ? 'location' : null"
            (click)="go(item.id)"
          >
            {{ i18n.t(item.labelKey) }}
          </button>
        </li>
      }
    </ul>

    <div class="mt-auto flex flex-col gap-3 pt-8">
      <a class="btn-primary" [href]="site.cv" target="_blank" rel="noopener noreferrer">
        <app-icon name="download" />
        {{ i18n.t('nav.downloadCv') }}
      </a>
      <div class="flex gap-2">
        <a
          class="btn-secondary flex-1"
          [href]="site.github"
          target="_blank"
          rel="noopener noreferrer"
        >
          <app-icon name="github" />
          GitHub
        </a>
        <a
          class="btn-secondary flex-1"
          [href]="site.linkedin"
          target="_blank"
          rel="noopener noreferrer"
        >
          <app-icon name="linkedin" />
          LinkedIn
        </a>
      </div>
    </div>
  </aside>
}

<section id="projects" class="section">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between" appReveal>
    <div class="max-w-2xl">
      <p class="section-kicker">04</p>
      <h2 class="text-3xl font-semibold tracking-tight sm:text-4xl">{{ i18n.t('projects.title') }}</h2>
      <p class="mt-3 text-paper-dim">{{ i18n.t('projects.subtitle') }}</p>
    </div>
    <a routerLink="/projects" class="btn-ghost !px-0 text-sm text-brass hover:text-brass-2">
      {{ i18n.t('projects.viewAll') }}
      <app-icon name="arrow-right" />
    </a>
  </div>

  <div class="mt-10 grid gap-5 lg:grid-cols-2">
    @for (project of featuredProjects; track project.id) {
      <div appReveal>
        <app-project-card [project]="project" [compact]="true" />
      </div>
    }
  </div>

  <div class="mt-10 flex justify-center" appReveal>
    <a
      class="btn-secondary"
      [href]="site.github"
      target="_blank"
      rel="noopener noreferrer"
    >
      <app-icon name="github" />
      {{ i18n.t('projects.viewGithub') }}
    </a>
  </div>
</section>

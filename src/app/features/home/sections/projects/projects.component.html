<section class="py-10 border-t border-neutral-800">
  <h2 class="text-2xl font-semibold">{{ i18n.t("projects.title") }}</h2>

  <div class="mt-6 grid lg:grid-cols-2 gap-4">
    @for (project of featuredProjects; track project.id) {
      <app-project-card [project]="project" [showStacks]="false" />
    }
  </div>

  <div class="mt-8 flex justify-center">
    <a
      mat-stroked-button
      class="!border-neutral-700 !text-neutral-100"
      routerLink="/projects"
    >
      <mat-icon class="mr-1">apps</mat-icon>
      {{ i18n.t("projects.viewAll") }}
    </a>
  </div>
</section>

<section class="py-10 border-t border-neutral-800">
  <h2 class="text-2xl font-semibold">
    {{ i18n.lang() === 'en' ? 'Architecture Highlights' : 'Aspectos Clave de Arquitectura' }}
  </h2>

  <mat-card class="mt-6 !bg-neutral-900/40 !border !border-neutral-800 !shadow-none rounded-2xl">
    <mat-card-content class="p-6">
      <ul class="space-y-3 text-neutral-300 text-sm">
        <li>• {{ items[0] }}</li>
        <li>• {{ items[1] }}</li>
        <li>• {{ items[2] }}</li>
        <li>• {{ items[3] }}</li>
        <li>• {{ items[4] }}</li>
        <li>• {{ items[5] }}</li>
      </ul>
    </mat-card-content>
  </mat-card>
</section>

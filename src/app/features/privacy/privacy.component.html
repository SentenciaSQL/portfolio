<div class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
  <a routerLink="/" class="inline-flex items-center gap-2 text-sm text-paper-dim no-underline hover:text-paper">
    <app-icon name="arrow-left" />
    {{ i18n.t('privacy.backHome') }}
  </a>

  <h1 class="mt-6 text-3xl font-semibold tracking-tight">{{ i18n.t('privacy.title') }}</h1>
  <p class="mt-2 text-sm text-mute">{{ i18n.t('privacy.updated') }}</p>
  <p class="mt-6 leading-relaxed text-paper-dim">{{ i18n.t('privacy.intro') }}</p>

  @for (section of sections(); track section.title) {
    <section class="mt-8">
      <h2 class="text-xl font-semibold text-paper">{{ section.title }}</h2>
      <p class="mt-3 leading-relaxed whitespace-pre-line text-paper-dim">{{ section.body }}</p>
    </section>
  }

  <p class="mt-10 leading-relaxed text-paper-dim">
    {{ i18n.t('privacy.contactPrefix') }}
    <a class="text-paper underline underline-offset-4" href="mailto:afriasdev@gmail.com">
      afriasdev@gmail.com
    </a>
  </p>
</div>

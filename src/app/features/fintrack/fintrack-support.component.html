<div class="mx-auto max-w-6xl px-5 py-16 sm:px-8 sm:py-20">
  <header class="max-w-3xl">
    <p class="text-xs font-semibold tracking-[0.14em] text-[#0d766e]">
      {{ copy().eyebrow }}
    </p>
    <h1
      class="mt-4 text-4xl font-semibold leading-tight tracking-tight sm:text-5xl"
    >
      {{ copy().title }}
    </h1>
    <p class="mt-4 text-lg leading-8 text-[#53635e]">{{ copy().intro }}</p>
  </header>

  <section
    class="mt-12 grid gap-12 border-y border-[#dce7e3] py-10 md:grid-cols-[0.8fr_1.2fr] md:gap-16"
  >
    <div>
      <h2 class="text-2xl font-semibold tracking-tight">
        {{ copy().contactTitle }}
      </h2>
      <p class="mt-3 max-w-md leading-7 text-[#53635e]">
        {{ copy().contactBody }}
      </p>
      <a
        [href]="'mailto:' + email"
        class="mt-6 inline-flex min-h-12 items-center gap-3 rounded-lg bg-[#0d766e] px-5 font-semibold text-white no-underline transition-colors hover:bg-[#095e58]"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-5 w-5">
          <path
            d="M4 5h16v14H4zM4 7l8 6 8-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        {{ copy().emailLabel }}
      </a>
      <p class="mt-3 text-sm text-[#64716d]">{{ email }}</p>
    </div>

    <div>
      <h2 class="text-2xl font-semibold tracking-tight">
        {{ copy().faqTitle }}
      </h2>
      <div class="mt-5 divide-y divide-[#dce7e3] border-y border-[#dce7e3]">
        @for (faq of copy().faqs; track faq.question) {
          <details class="group py-5">
            <summary
              class="flex cursor-pointer list-none items-start justify-between gap-5 font-medium marker:hidden"
            >
              <span>{{ faq.question }}</span>
              <span
                class="text-xl leading-6 text-[#0d766e] transition-transform group-open:rotate-45"
                aria-hidden="true"
                >+</span
              >
            </summary>
            <p class="max-w-2xl pt-3 leading-7 text-[#53635e]">
              {{ faq.answer }}
            </p>
          </details>
        }
      </div>
    </div>
  </section>

  <p class="mt-8 text-sm text-[#64716d]">{{ copy().note }}</p>
</div>
